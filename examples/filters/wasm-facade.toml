# A conventional repository: the defaults but the extractor (here built from wasm-facade's sources at the root;
# `wasm-facade` once installed), the converters and the wasm module

extractor = ["cargo", "run", "-q", "--manifest-path", "../../Cargo.toml", "--"]
converters = "src/converters.ts"
wasm = "../pkg/filters.js"

[format]
".ts" = ["npx", "--no-install", "biome", "check", "--write", "--stdin-file-path={name}"]

[targets.typescript]
[targets.react]
[targets.reference]
title = "filters"

[targets.python]
out = "python/filters/_api.py"
title = "filters"

[targets.python-reference]
out = "docs/python.md"
title = "filters"

[targets.react-native]

# <filters-blur>'s attributes: the blur's options
[targets.web-component]
from = ["BlurOptions"]
