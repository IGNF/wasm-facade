name: Pages

# The site: the overview, the demo (the example built to wasm, called through its generated facade) and the
# example's generated reference, built by `bun site/build.ts` and published on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/filters
      - name: wasm-bindgen, the version the example locks
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' examples/filters/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" | tar xz
          echo "$PWD/wasm-bindgen-$version-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun site/build.ts --repository=${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
