name: Release

# On a tag v<version>, once the crate of that version is on crates.io (`cargo publish`, PUBLISHING.md): the extractor
# built for each platform, published as wasm-facade-<os>-<cpu>, then the wasm-facade package naming them as its
# optional dependencies. Needs the NPM_TOKEN secret. Run by hand (Actions, "Run workflow"), it builds everything and
# publishes nothing (npm publish --dry-run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wasm-facade${{ runner.os == 'Windows' && '.exe' || '' }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: binaries
      - name: The tag is the package's version
        if: github.ref_type == 'tag'
        run: test "v$(node -p 'require("./npm/package.json").version')" = "${GITHUB_REF_NAME}"
      - run: bun npm/scripts/platforms.ts binaries platforms
      - run: bun install
      - name: The platform packages, then the main package (a version already published is left as it is)
        run: |
          dry=$([ "$GITHUB_REF_TYPE" = tag ] || echo --dry-run)
          for dir in platforms/*/ npm/; do
            id="$(node -p "const p = require('./${dir}package.json'); p.name + '@' + p.version")"
            if npm view "$id" version >/dev/null 2>&1; then echo "$id: already published"; continue; fi
            (cd "$dir" && npm publish --access public $dry)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
