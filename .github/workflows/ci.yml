name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # The core's tests, the example's check among them (it runs the extractor: cargo)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun run test

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      # What the example's declarations make is what it holds
      - run: bun run example:check
      # Its Python over a transport of its own: run, and typed strictly
      - run: python3 test_filters.py
        working-directory: examples/filters/python
      - run: npx -y pyright@1.1.414
        working-directory: examples/filters/python

  node:
    # The published package on Node, without Bun: the core's tests on a Node that strips types, then the built CLI
    # checking the example on the oldest Node supported
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run test:node
      - run: npm run build --workspace npm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ../../npm/dist/cli.js check
        working-directory: examples/filters
